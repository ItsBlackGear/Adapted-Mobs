plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:platform:1.3.3-fabric,1.21.1"

    modRuntimeOnly "dev.emi:emi-fabric:${emi_version}"

    // modImplementation "maven.modrinth:tolerable-creepers:${tolerable_creepers_version}-fabric"
    modImplementation "com.evandev.tolerable_creepers:tolerable-creepers-fabric:2.2.4-pre3-local"

    // YACL
    modImplementation "maven.modrinth:yacl:${yacl_version}-fabric"
    implementation "org.quiltmc.parsers:json:0.3.0"
    implementation "org.quiltmc.parsers:gson:0.3.0"
    include "org.quiltmc.parsers:json:0.3.0"
    include "org.quiltmc.parsers:gson:0.3.0"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        datagen {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(':common').file('src/main/generated')}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            runDir "build/datagen"
        }
    }
}

sourceSets.main.resources.srcDirs += project(':common').file('src/main/generated')

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
}