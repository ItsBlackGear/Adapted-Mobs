modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
#issueTrackerURL = ""
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
credits = "${credits}"
description = "${description}"
logoFile = "icon.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "platform"
type = "required"
versionRange = "[1.3.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tolerable_creepers"
type = "optional"
versionRange = "[2.2.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
type = "required"
versionRange = "[${yacl_version},)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "${mod_id}.mixins.json"
