plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDirs += project(':common').file('src/main/generated')

dependencies {
    implementation "maven.modrinth:platform:1.3.3-neoforge,1.21.1"

    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    compileOnly "maven.modrinth:tolerable-creepers:${tolerable_creepers_version}-neoforge"

    implementation "maven.modrinth:yacl:${yacl_version}-neoforge"
}

publishMods {
    file = tasks.named("jar").flatMap { it.archiveFile }
}