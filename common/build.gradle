architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/adaptedmobs.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
//    modImplementation "flatDir:Platform-common-1.21.1-$rootProject.platform_indev_version"
    modImplementation "maven.modrinth:platform:1.3.3-fabric,1.21.1"

    // modImplementation "maven.modrinth:tolerable-creepers:${tolerable_creepers_version}-fabric"
    modImplementation "com.evandev.tolerable_creepers:tolerable-creepers-fabric:2.2.3-local"
}
